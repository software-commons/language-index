name: Domain

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-tests:
    name: Registry tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: index
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: software-commons/.github
          ref: ab26f278422772f2d9e5d4dd016407d14372a710
          path: policy
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pinned SCES dependencies
        working-directory: policy
        run: python -I -m pip install --disable-pip-version-check -r tools/sces/requirements.txt
      - name: Run registry tests
        working-directory: index
        env:
          SCES_POLICY_ROOT: ${{ github.workspace }}/policy
        run: |
          set -eu
          python -B -m unittest discover -s tests -v
  registry:
    name: Registry validation
    needs: registry-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the isolated test job to pass
        env:
          REGISTRY_TEST_RESULT: ${{ needs.registry-tests.result }}
        run: test "$REGISTRY_TEST_RESULT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: index
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: software-commons/.github
          ref: ab26f278422772f2d9e5d4dd016407d14372a710
          path: policy
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pinned SCES dependencies
        working-directory: policy
        run: python -I -m pip install --disable-pip-version-check -r tools/sces/requirements.txt
      - name: Validate the proposed revision from a fresh checkout
        working-directory: index
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCES_POLICY_ROOT: ${{ github.workspace }}/policy
        run: |
          set -eu
          python -I -B "$SCES_POLICY_ROOT/tools/sces/validate.py" --policy-only
          args=()
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python -I -B tools/index.py --policy "$SCES_POLICY_ROOT" validate "${args[@]}"
